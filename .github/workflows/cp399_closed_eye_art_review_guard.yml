name: CP399 Lâm Thiển closed-eye art review guard
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp399_closed_eye_art_review.py'
      - 'tests/art/test_cp399_closed_eye_art_review.py'
      - '.github/workflows/cp399_closed_eye_art_review_guard.yml'
  pull_request:
    paths:
      - 'tools/art/cp399_closed_eye_art_review.py'
      - 'tests/art/test_cp399_closed_eye_art_review.py'
      - '.github/workflows/cp399_closed_eye_art_review_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source review dependencies
        run: python -m pip install 'Pillow>=10,<14' 'numpy>=1.26,<3'
      - name: Static guard plus source-dependent tests
        run: PYTHONPATH=tools/art python -m unittest discover -s tests/art -p 'test_cp399_closed_eye_art_review.py' -v
      - name: Do not promote unapproved art
        run: |
          echo 'Without private approved CANON/CP398 sources, 4 static PASS and 9 private SKIP expected.'
          echo 'SKIP is not artwork acceptance. No production sprite, animation, or APK release.'
