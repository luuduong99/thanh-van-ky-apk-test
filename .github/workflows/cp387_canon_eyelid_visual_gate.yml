name: CP387 Lâm Thiển exact CANON eyelid source gate
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp387_occlusion_and_artist_gate.py'
      - 'tests/art/test_cp387_occlusion_and_artist_gate.py'
      - '.github/workflows/cp387_canon_eyelid_visual_gate.yml'
  pull_request:
    paths:
      - 'tools/art/cp387_occlusion_and_artist_gate.py'
      - 'tests/art/test_cp387_occlusion_and_artist_gate.py'
      - '.github/workflows/cp387_canon_eyelid_visual_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source QA dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Verify public source guard (private CANON art tests skip)
        run: python -m unittest discover -s tests/art -p 'test_cp387_occlusion_and_artist_gate.py' -v
      - name: Do not approve rejected draft variants
        run: |
          echo 'Without private CANON: 3 static PASS / 6 source-dependent SKIP.'
          echo 'CP387 candidates rejected; visual_qa=NOT_PASSED; release blocked_pending_art.'
