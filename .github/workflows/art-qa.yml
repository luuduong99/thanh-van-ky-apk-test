name: TVK Art QA (synthetic ORA tests)
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/**'
      - 'tests/art/**'
      - '.github/workflows/art-qa.yml'
  workflow_dispatch:
jobs:
  art-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<14'
      - name: Run synthetic ORA quality checks
        run: python -m unittest discover -s tests/art -v
