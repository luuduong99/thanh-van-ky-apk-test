name: CP394 source-locked CANON eyelashes and underpaint
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp394_source_lash_underpaint.py'
      - 'tests/art/test_cp394_source_lash_underpaint.py'
      - '.github/workflows/cp394_source_lash_underpaint_guard.yml'
  pull_request:
    paths:
      - 'tools/art/cp394_source_lash_underpaint.py'
      - 'tests/art/test_cp394_source_lash_underpaint.py'
      - '.github/workflows/cp394_source_lash_underpaint_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source QA dependencies
        run: python -m pip install 'Pillow>=10,<14' 'numpy>=1.26,<3'
      - name: Check static contract; private art checks deliberately skip
        run: PYTHONPATH=tools/art python -m unittest discover -s tests/art -p 'test_cp394_source_lash_underpaint.py' -v
      - name: Respect visual approval gate
        run: |
          echo 'Public CI without private CANON: 4 PASS / 7 SKIP expected.'
          echo 'CP394 source-lash closed-eye DRAFT is NOT_PASSED visual QA, never production art.'
