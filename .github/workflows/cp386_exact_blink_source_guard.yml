name: CP386 exact-CANON eyelid draft source guard
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp386_painted_blink_draft.py'
      - 'tests/art/test_cp386_painted_blink_draft.py'
      - '.github/workflows/cp386_exact_blink_source_guard.yml'
  pull_request:
    paths:
      - 'tools/art/cp386_painted_blink_draft.py'
      - 'tests/art/test_cp386_painted_blink_draft.py'
      - '.github/workflows/cp386_exact_blink_source_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-draft-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-only image test requirements
        run: python -m pip install Pillow numpy opencv-python-headless
      - name: Public CI checks, private CANON-dependent checks skip
        run: python -m unittest discover -s tests/art -p 'test_cp386_painted_blink_draft.py' -v
      - name: Confirm art remains blocked
        run: |
          echo 'Public source: 3 PASS / 7 SKIP expected without the approved private CANON.'
          echo 'CP386 skin patch and closed eyes are NOT_PASSED visual QA, not release assets.'
