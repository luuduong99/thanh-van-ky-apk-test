name: Build Android APK

on:
  push:
    branches: [ "main", "map-2d-prototype" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate character artwork and touch regions
        run: python3 tools/validate_pose_assets.py

      - name: Validate global character appearance rules
        run: python3 tools/validate_global_appearance.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thanh-van-ky-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
