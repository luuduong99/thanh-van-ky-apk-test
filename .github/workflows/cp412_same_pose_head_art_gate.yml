name: CP412 Lâm Thiển same-pose head art gate
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp412_same_pose_head_art_gate.py'
      - 'tests/art/test_cp412_same_pose_head_art_gate.py'
      - '.github/workflows/cp412_same_pose_head_art_gate.yml'
  pull_request:
    paths:
      - 'tools/art/cp412_same_pose_head_art_gate.py'
      - 'tests/art/test_cp412_same_pose_head_art_gate.py'
      - '.github/workflows/cp412_same_pose_head_art_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline QA requirements
        run: python -m pip install 'Pillow>=10,<14' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Test public contract (private source tests must SKIP)
        run: PYTHONPATH=tools/art python -m unittest discover -s tests/art -p 'test_cp412_same_pose_head_art_gate.py' -v
      - name: Art is not approved by passing public tests
        run: |
          echo '5 static PASS / 5 private-source SKIP expected.'
          echo 'CANON bitmap absent from repo; CP412 art, head rig and APK release are still BLOCKED.'
