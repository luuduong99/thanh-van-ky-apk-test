name: CP409 Lâm Thiển anatomical eyelid motion QA
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp409_eyelid_kinematic.py'
      - 'tests/art/test_cp409_eyelid_kinematic.py'
      - 'app/src/main/java/vn/thanhvanky/prototype/TVKBlinkAtlasPreviewActivity.kt'
      - '.github/workflows/cp409_geometric_eyelid_guard.yml'
  pull_request:
    paths:
      - 'tools/art/cp409_eyelid_kinematic.py'
      - 'tests/art/test_cp409_eyelid_kinematic.py'
      - 'app/src/main/java/vn/thanhvanky/prototype/TVKBlinkAtlasPreviewActivity.kt'
      - '.github/workflows/cp409_geometric_eyelid_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock-without-art-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline artwork QA dependencies
        run: python -m pip install 'Pillow>=10,<14' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Run CP409 geometric eyelid tests (approved bitmap private)
        run: PYTHONPATH=tools/art python -m unittest discover -s tests/art -p 'test_cp409_eyelid_kinematic.py' -v
      - name: Release gate — preview not production
        run: |
          echo 'Public expected 7 PASS, 9 private-source SKIP; local 15 PASS / 1 unavailable Android-source SKIP.'
          echo 'Do not interpret CI source tests as artist QA, Android device verification, or rig completion.'
          echo 'CP409 atlas is SHA-locked and selected through debug file picker, never bundled as released sprite.'
