name: CP385 Lâm Thiển exact-static blink technical guard
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp385_blink_shape_study.py'
      - 'tests/art/test_cp385_blink_shape_study.py'
      - '.github/workflows/cp385_blink_static_source_guard.yml'
  pull_request:
    paths:
      - 'tools/art/cp385_blink_shape_study.py'
      - 'tests/art/test_cp385_blink_shape_study.py'
      - '.github/workflows/cp385_blink_static_source_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-art-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy opencv-python-headless
      - name: Verify static public source guard (private art tests skip)
        run: python -m unittest discover -s tests/art -p 'test_cp385_blink_shape_study.py' -v
      - name: Artist approval cannot be inferred from CI
        run: |
          echo 'Expected without private CANON: 3 PASS / 7 SKIP.'
          echo 'Blink pose uses TECH inpaint and is NOT_PASSED for visual QA.'
          echo 'Production release blocked_pending_art; sprite_paths empty.'
