name: CP415 Lam Thien source-locked underpaint study QA
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp415_source_locked_underpaint.py'
      - 'tests/art/test_cp415_source_locked_underpaint.py'
      - '.github/workflows/cp415_underpaint_study.yml'
  pull_request:
    paths:
      - 'tools/art/cp415_source_locked_underpaint.py'
      - 'tests/art/test_cp415_source_locked_underpaint.py'
      - '.github/workflows/cp415_underpaint_study.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  static-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline QA dependencies
        run: python -m pip install 'Pillow>=10,<14' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: CP415 source guard (CANON private tests must SKIP)
        run: PYTHONPATH=tools/art python -m unittest discover -s tests/art -p 'test_cp415_source_locked_underpaint.py' -v
      - name: Honest release gate
        run: |
          echo 'Expected 4 public PASS, 8 private CANON SKIP.'
          echo 'Painted pigmented patches are DRAFT, underplate retains technical inpaint.'
          echo 'Not painter-grade, not Spine ready, no production sprite paths.'
