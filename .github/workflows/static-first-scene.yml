name: TVK Static-first View-only Scene Contract
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'app/src/main/java/vn/thanhvanky/prototype/CharacterInteractionActivity.kt'
      - 'app/src/main/java/vn/thanhvanky/prototype/MainActivity.kt'
      - 'docs/team/STATIC_FIRST_SCENE_MODE.md'
      - 'tests/ui/test_static_scene_view_contract.py'
      - '.github/workflows/static-first-scene.yml'
  pull_request:
    paths:
      - 'app/src/main/java/vn/thanhvanky/prototype/CharacterInteractionActivity.kt'
      - 'app/src/main/java/vn/thanhvanky/prototype/MainActivity.kt'
      - 'docs/team/STATIC_FIRST_SCENE_MODE.md'
      - 'tests/ui/test_static_scene_view_contract.py'
      - '.github/workflows/static-first-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify static-only body, intact controls and scene UI
        run: python -m unittest discover -s tests/ui -p 'test_static_scene_view_contract.py' -v
      - name: Explicit visual and device QA gate
        run: |
          echo 'Static scene/view-only is an integration behavior change.'
          echo 'PASS does not prove visual quality, FPS, phone runtime or art approval.'
