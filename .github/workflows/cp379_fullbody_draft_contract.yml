name: CP379 full-body draft technical source guard
on:
  push:
    branches: [map-2d-prototype]
    paths:
      - 'tools/art/cp379_fullbody_vector_blocking.py'
      - 'tools/art/requirements_cp379.txt'
      - 'tests/art/test_cp379_fullbody_vector_blocking.py'
      - '.github/workflows/cp379_fullbody_draft_contract.yml'
  pull_request:
    paths:
      - 'tools/art/cp379_fullbody_vector_blocking.py'
      - 'tools/art/requirements_cp379.txt'
      - 'tests/art/test_cp379_fullbody_vector_blocking.py'
      - '.github/workflows/cp379_fullbody_draft_contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/art/requirements_cp379.txt
      - name: Source-locked draft static tests, private CANON tests intentionally skipped
        run: python -m unittest discover -s tests/art -p 'test_cp379_fullbody_vector_blocking.py' -v
      - name: Art acceptance is still blocked
        run: echo 'PASS in CI covers static contract only; Visual QA NOT_PASSED, sprites empty, no APK.'
